# USB Ethernet link used by the NBD netboot.
#
# The phone owns the link: its initramfs assigns NB_PHONE_IP to the gadget and
# runs unudhcpd, which leases NB_HOST_IP to the host. The host must therefore
# use a static address (scripts/netboot/setup-usbnet.sh) and must not run its
# own DHCP server on this interface.
#
# If your host already owns .1 on this subnet (for example Windows Internet
# Connection Sharing uses 192.168.137.1), swap the two addresses:
#
#   NB_PHONE_IP=192.168.137.2
#   NB_HOST_IP=192.168.137.1
#
# This file is sourced by the host scripts and copied verbatim into the
# initramfs as /etc/idroid-net.conf, so there is one source of truth.

NB_PHONE_IP=192.168.137.1
NB_HOST_IP=192.168.137.2
NB_PREFIX=24

NB_NBD_PORT=10809
NB_NBD_EXPORT=idroid
